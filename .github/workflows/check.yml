name: Repo check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repo check (private leftovers, Agent Skills compliance)
        run: npm run check
      - name: Tests
        run: npm test
